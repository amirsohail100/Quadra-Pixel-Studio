<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Quadra Pixel — Floating Gaming Particles</title>
  <desc id="desc">A clean cyan, coral red and purple faceted 3D hexagon with a central pixel Q. Separate controller-inspired X, O, triangle and square glyphs float as small neon particles around the outside; no controller or symbol cluster appears in the center. Transparent background.</desc>
  <defs>
    <linearGradient id="cyanTopL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20F3F3"/><stop offset=".54" stop-color="#11C8D8"/><stop offset="1" stop-color="#087FAD"/>
    </linearGradient>
    <linearGradient id="cyanTopR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13E5EA"/><stop offset=".55" stop-color="#0AAFCB"/><stop offset="1" stop-color="#1268AA"/>
    </linearGradient>
    <linearGradient id="cyanSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15E3E8"/><stop offset="1" stop-color="#0997BC"/>
    </linearGradient>
    <linearGradient id="redSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F34C58"/><stop offset="1" stop-color="#B91E42"/>
    </linearGradient>
    <linearGradient id="redBottomR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5B62"/><stop offset=".55" stop-color="#ED354E"/><stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <linearGradient id="redBottomL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5962"/><stop offset=".55" stop-color="#E93650"/><stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <linearGradient id="purpleTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B65CFF"/><stop offset=".6" stop-color="#8A2BE2"/><stop offset="1" stop-color="#5C21B6"/>
    </linearGradient>
    <linearGradient id="cyanTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72FFFF"/><stop offset="1" stop-color="#10C8D8"/>
    </linearGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10192B"/><stop offset=".5" stop-color="#11152A"/><stop offset="1" stop-color="#25112F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25F4F3"/><stop offset=".48" stop-color="#8A2BE2"/><stop offset="1" stop-color="#F04452"/>
    </linearGradient>
    <filter id="cyanGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main emblem: unchanged faceted hexagon + pixel Q, centered with room for floating particles. -->
  <g id="main-emblem" transform="translate(256 256) scale(0.84) translate(-256 -231)">

  <g stroke-linejoin="round" stroke-width="1.4">
    <path d="M256 34 86 132 166 179 256 126Z" fill="url(#cyanTopL)" stroke="#8AFFFF" stroke-opacity=".34"/>
    <path d="M256 34 426 132 346 179 256 126Z" fill="url(#cyanTopR)" stroke="#8AFFFF" stroke-opacity=".34"/>
    <path d="M426 132 426 229 346 229 346 179Z" fill="url(#cyanSide)" stroke="#83FFFF" stroke-opacity=".26"/>
    <path d="M426 229 426 329 346 282 346 229Z" fill="url(#redSide)" stroke="#FF9BA1" stroke-opacity=".24"/>
    <path d="M426 329 256 428 256 332 346 282Z" fill="url(#redBottomR)" stroke="#FF9BA1" stroke-opacity=".24"/>
    <path d="M256 428 86 329 166 282 256 332Z" fill="url(#redBottomL)" stroke="#FF9BA1" stroke-opacity=".24"/>
    <path d="M86 329 86 229 166 229 166 282Z" fill="url(#redSide)" stroke="#FF9BA1" stroke-opacity=".24"/>
    <path d="M86 229 86 132 166 179 166 229Z" fill="url(#cyanSide)" stroke="#83FFFF" stroke-opacity=".26"/>
  </g>

  <!-- Neon outer bevel, cyan on the upper half and coral on the lower half. -->
  <path d="M256 34 426 132 426 229" fill="none" stroke="#43FFFF" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M426 229 426 329 256 428 86 329 86 229" fill="none" stroke="#F04452" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 229 86 132 256 34" fill="none" stroke="#43FFFF" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 34 256 126M166 179 256 126 346 179M166 229h-80M346 229h80" fill="none" stroke="#BDFEFF" stroke-width="1.5" stroke-opacity=".43"/>

  <!-- Recessed center chamber with a purple digital rim. -->
  <path d="M256 126 346 179 346 282 256 334 166 282 166 179Z" fill="url(#coreFill)" stroke="url(#rim)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256 139 334 184 334 275 256 320 178 275 178 184Z" fill="none" stroke="#31DDE4" stroke-opacity=".42" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M193 188h20l8 8M319 188h-20l-8 8M193 272h20l8-8M319 272h-20l-8-8" fill="none" stroke="#26E2E8" stroke-width="2.4" stroke-linecap="round" opacity=".78"/>
  <g filter="url(#smallGlow)">
    <circle cx="190" cy="188" r="3.2" fill="#20E7EA"/><circle cx="322" cy="188" r="3.2" fill="#20E7EA"/>
    <circle cx="190" cy="272" r="3.2" fill="#F04452"/><circle cx="322" cy="272" r="3.2" fill="#F04452"/>
  </g>

  <!-- Pixel Q mark from the prior version, now recolored and refined. -->
  <g shape-rendering="crispEdges">
    <!-- Q bowl: pixel tiles with softened luminous highlights -->
    <rect x="221" y="184" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="246" y="184" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="271" y="184" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="196" y="209" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="296" y="209" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="196" y="234" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="296" y="234" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="196" y="259" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="221" y="259" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="246" y="259" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="271" y="259" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="296" y="259" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <!-- A cyan digital spark in the core and a red pixel tail make the Q distinct. -->
    <rect x="271" y="284" width="22" height="22" rx="2" fill="url(#purpleTile)"/>
    <rect x="296" y="284" width="22" height="22" rx="2" fill="#EF4052"/>
  </g>

  </g>

  <!-- Floating gaming glyph particles: independently scattered outside the emblem, not inside button wells. -->
  <g id="floating-particles" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- X glyphs -->
    <path d="M55 107l10 10M65 107l-10 10" stroke="#20E7EA" stroke-width="2.7" filter="url(#smallGlow)"/>
    <path d="M438 337l9 9M447 337l-9 9" stroke="#F04452" stroke-width="2.5" filter="url(#smallGlow)"/>
    <path d="M111 413l6 6M117 413l-6 6" stroke="#8A2BE2" stroke-width="2" opacity=".85"/>

    <!-- O / circle glyphs: the circle itself is the symbol, never a container around another glyph. -->
    <circle cx="444" cy="190" r="6.5" stroke="#14DDE7" stroke-width="2.5" filter="url(#smallGlow)"/>
    <circle cx="76" cy="371" r="5.5" stroke="#8A2BE2" stroke-width="2.3" filter="url(#smallGlow)"/>
    <circle cx="391" cy="72" r="4.5" stroke="#F04452" stroke-width="2.1" opacity=".9"/>

    <!-- Triangle glyphs -->
    <path d="M443 103l-7 12h14Z" stroke="#8A2BE2" stroke-width="2.5" filter="url(#smallGlow)"/>
    <path d="M70 270l-6 10h12Z" stroke="#F04452" stroke-width="2.2" opacity=".9"/>
    <path d="M381 455l-5 9h10Z" stroke="#14DDE7" stroke-width="2.1" opacity=".9"/>

    <!-- Square glyphs -->
    <rect x="88" y="179" width="10" height="10" stroke="#14DDE7" stroke-width="2.4" filter="url(#smallGlow)"/>
    <rect x="419" y="393" width="9" height="9" stroke="#8A2BE2" stroke-width="2.2" filter="url(#smallGlow)"/>
    <rect x="144" y="456" width="7" height="7" stroke="#F04452" stroke-width="2" opacity=".9"/>
  </g>

  <!-- Sparse pixel sparks and short neon fragments complete the particle effect. -->
  <g shape-rendering="crispEdges">
    <rect x="88" y="77" width="4" height="4" fill="#14DDE7" opacity=".9"/>
    <rect x="101" y="89" width="3" height="3" fill="#8A2BE2" opacity=".88"/>
    <rect x="463" y="129" width="4" height="4" fill="#F04452" opacity=".92"/>
    <rect x="451" y="142" width="3" height="3" fill="#14DDE7" opacity=".8"/>
    <rect x="45" y="311" width="4" height="4" fill="#8A2BE2" opacity=".9"/>
    <rect x="99" y="393" width="4" height="4" fill="#F04452" opacity=".9"/>
    <rect x="469" y="297" width="3" height="3" fill="#14DDE7" opacity=".9"/>
    <rect x="408" y="440" width="4" height="4" fill="#8A2BE2" opacity=".9"/>
    <rect x="256" y="49" width="4" height="4" fill="#14DDE7" opacity=".88"/>
    <rect x="267" y="60" width="3" height="3" fill="#F04452" opacity=".85"/>
    <rect x="253" y="467" width="4" height="4" fill="#8A2BE2" opacity=".9"/>
    <path d="M124 126h12M376 125h12M112 347h9M391 414h11" stroke="#14DDE7" stroke-width="1.8" opacity=".75"/>
    <path d="M57 229h8M447 247h9M182 476h7M325 42h7" stroke="#8A2BE2" stroke-width="1.8" opacity=".8"/>
  </g>
</svg>
